<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#43593F">
<title>Kuchařka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EDD6CC;
    --bg-deep: #D3A292;
    --paper: #FCF6F2;
    --ink: #233349;
    --ink-soft: #5C7481;
    --line: #DDBFAE;
    --primary: #233349;
    --primary-dark: #16212F;
    --primary-tint: #D7DEE3;
    --accent: #A8512F;
    --accent-tint: #F1DCD2;
    --mustard: #C4772A;
    --shadow: rgba(35,51,73,0.18);

    --tag-sladke: #B5657E;
    --tag-slane: #5B6B4F;
    --tag-snidane: #C4772A;
    --tag-obed: #A8512F;
    --tag-vyzkouseno: #3D5C63;
    --tag-nevyzkouseno: #9E8F86;
    --tag-jaro: #7DA06A;
    --tag-leto: #D3A292;
    --tag-podzim: #8A4A28;
    --tag-zima: #4A6B84;
    --tag-bezmasne: #5C8A6E;
    --tag-dezert: #8C4A63;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(43,38,32,0.06) 1px, transparent 0) 0 0/24px 24px,
      linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 320px);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    padding-bottom: 70px;
  }

  h1,h2,h3, .display{
    font-family: 'Fraunces', serif;
  }

  a { color: var(--accent); }

  /* ---------- Header ---------- */
  header{
    max-width: 1000px;
    margin: 0 auto;
    padding: 44px 24px 22px;
    display:flex;
    align-items:flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand .icon{
    width:52px; height:52px; flex-shrink:0;
    border-radius: 14px;
    background: var(--primary);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 14px rgba(35,51,73,0.35);
    transform: rotate(-4deg);
  }
  .brand .icon svg{ width:28px; height:28px; }
  header h1{
    font-size: 42px;
    font-weight: 700;
    margin: 0;
    line-height: 1;
    letter-spacing: -0.015em;
    color: var(--primary-dark);
  }
  header p{
    margin: 7px 0 0;
    color: var(--ink-soft);
    font-size: 15px;
    font-style: italic;
  }

  .btn{
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{ background: var(--primary); color: #FBF7EC; box-shadow: 0 4px 12px rgba(35,51,73,0.35); }
  .btn-primary:hover{ background: var(--primary-dark); }
  .btn-ghost{ background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 7px; }
  .btn-ghost:hover{ border-color: var(--ink-soft); background: rgba(43,38,32,0.03); }
  .btn-accent{ background: var(--accent); color: #FBF7EC; }

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .search-row{ display:flex; gap:10px; flex-wrap: wrap; }
  .search-row input[type=text]{
    flex: 1 1 260px;
  }

  input[type=text], input[type=number], input[type=url], textarea{
    font-family: 'Karla', sans-serif;
    font-size: 14.5px;
    padding: 10px 13px;
    border-radius: 7px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    width: 100%;
  }
  input:focus, textarea:focus{
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-tint);
  }
  textarea{ resize: vertical; min-height: 90px; font-size: 14px; line-height: 1.5; }

  .chips{ display:flex; gap:8px; flex-wrap: wrap; }
  .chip{
    font-family:'Karla',sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .15s ease;
  }
  .chip:hover{ border-color: var(--ink-soft); }
  .chip .dot{ width:8px; height:8px; border-radius:50%; }
  .chip.active{
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 6px rgba(0,0,0,0.18);
  }

  .finder{
    background: var(--paper);
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .pantry-head{ font-weight: 700; font-size: 14px; color: var(--primary-dark); margin-bottom: 10px; }
  .pantry-add-row{ display:flex; gap: 8px; margin-bottom: 10px; }
  .pantry-add-row input{ flex: 1; }
  .pantry-list{ display:flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pantry-item{
    display:flex; align-items:center; gap:6px;
    background: var(--bg); border: 1.5px solid var(--line); border-radius: 20px;
    padding: 6px 6px 6px 11px; font-size: 13.5px; cursor: pointer;
  }
  .pantry-item.have{ background: var(--primary-tint); border-color: var(--primary); }
  .pantry-item input[type=checkbox]{ width:15px; height:15px; accent-color: var(--primary); cursor:pointer; }
  .pantry-del{ background:none; border:none; color: var(--ink-soft); cursor:pointer; font-size: 12px; padding: 2px 4px; border-radius: 50%; }
  .pantry-del:hover{ color: var(--accent); background: rgba(156,69,54,0.1); }
  .pantry-empty{ font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
  .finder-extra{ margin-bottom: 10px; }
  .finder-extra input{ width: 100%; }
  .finder > label{ display:flex; align-items:center; gap:6px; cursor:pointer; font-size: 13.5px; color: var(--ink-soft); }

  .sort-row{ display:flex; align-items:center; gap: 10px; margin-top: 14px; }
  .sort-row label{ font-size: 13.5px; font-weight: 700; color: var(--ink-soft); white-space: nowrap; }
  .sort-row select{
    flex: 1; font-family: 'Karla', sans-serif; font-size: 14px;
    padding: 9px 11px; border-radius: 7px; border: 1.5px solid var(--line);
    background: var(--paper); color: var(--ink);
  }

  /* ---------- Grid ---------- */
  .grid{
    max-width: 1000px;
    margin: 30px auto 0;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    gap: 24px;
  }

  .card{
    background: var(--paper);
    border-radius: 10px;
    border-left: 5px solid var(--card-color, var(--primary));
    padding: 18px 20px 16px;
    box-shadow: 0 4px 14px var(--shadow);
    cursor: pointer;
    position: relative;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .card:nth-child(3n+1){ transform: rotate(-0.5deg); }
  .card:nth-child(3n+2){ transform: rotate(0.4deg); }
  .card:nth-child(3n){ transform: rotate(-0.3deg); }
  .card:hover{ transform: rotate(0deg) translateY(-3px); box-shadow: 0 10px 22px var(--shadow); }

  .card h3{
    margin: 4px 0 8px;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.2;
    padding-bottom: 9px;
    border-bottom: 1px dashed var(--line);
    color: var(--primary-dark);
  }
  .card .meta{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 10px; }
  .card .time{ font-size: 13px; color: var(--ink-soft); }
  .card .tags{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom: 10px; }
  .tag-pill{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .01em;
    color: #fff;
    padding: 3px 9px;
    border-radius: 10px;
  }
  .card .match{ font-size: 12.5px; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
  .card .match.partial{ color: var(--mustard); }

  .empty-state{
    max-width: 1000px;
    margin: 50px auto;
    padding: 40px 24px;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state svg{ width:84px; height:84px; margin-bottom:14px; opacity:0.75; }
  .empty-state h3{ color: var(--ink); margin-bottom: 6px; }

  /* ---------- Stars ---------- */
  .stars{ display:inline-flex; gap: 2px; }
  .star{
    position: relative;
    width: 20px; height: 19px;
    display:inline-block;
  }
  .star svg{ position:absolute; top:0; left:0; width:100%; height:100%; }
  .star .bg-star path{ fill: var(--line); }
  .star .fg-wrap{ position:absolute; top:0; left:0; height:100%; overflow:hidden; }
  .star .fg-wrap svg path{ fill: var(--mustard); }
  .star .hit{ position:absolute; top:0; height:100%; width:50%; cursor:pointer; }
  .star .hit.left{ left:0; }
  .star .hit.right{ right:0; }
  .stars.lg .star{ width:28px; height:27px; }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset:0; background: rgba(43,38,32,0.5);
    display:none; align-items:flex-start; justify-content:center;
    padding: 40px 16px; overflow-y:auto; z-index: 50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--paper);
    max-width: 660px; width:100%;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  }
  .modal-strip{ height:7px; background: linear-gradient(90deg, var(--primary), var(--mustard)); }
  .modal-inner{ padding: 26px 30px 28px; }
  .modal-head{ display:flex; justify-content: space-between; align-items:flex-start; gap: 12px; margin-bottom: 6px;}
  .modal h2{ margin: 0; font-size: 27px; font-weight: 700; color: var(--primary-dark); }
  .icon-btn{
    background: none; border: none; cursor: pointer; color: var(--ink-soft);
    font-size: 18px; line-height: 1; padding: 4px;
    border-radius: 6px;
  }
  .icon-btn:hover{ color: var(--ink); background: rgba(43,38,32,0.06); }
  .icon-btn svg{ width: 18px; height: 18px; display: block; }
  .field{ margin-bottom: 17px; }
  .field label{ display:block; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .field-row{ display:flex; gap: 14px; }
  .field-row .field{ flex: 1; }
  .modal .tags{ display:flex; gap:8px; flex-wrap:wrap; }

  .view-block{ margin-bottom: 20px; }
  .view-block h4{ font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; font-weight:700; text-transform: uppercase; letter-spacing: .03em; }

  .ing-list{ list-style: none; margin: 0; padding: 0; }
  .ing-row{ display:flex; align-items:flex-start; gap: 10px; padding: 6px 0; cursor: pointer; }
  .ing-row input[type=checkbox]{ width: 17px; height:17px; margin-top: 2px; accent-color: var(--primary); cursor: pointer; }
  .ing-row span{ line-height: 1.4; }
  .ing-row.checked span{ color: var(--ink-soft); text-decoration: line-through; }
  .ing-label{
    font-weight: 700; font-family: 'Fraunces', serif; font-size: 15px;
    color: var(--primary-dark); margin: 12px 0 4px; padding-top: 6px;
    border-top: 1px dashed var(--line);
  }
  .ing-label:first-child{ margin-top: 0; padding-top: 0; border-top: none; }
  .ing-head{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 8px; }
  .ing-head button{ background:none; border:none; color: var(--ink-soft); font-size: 12px; text-decoration: underline; cursor: pointer; padding:0; }

  .steps-view{ margin:0; padding:0; }
  .step-line{ display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; line-height:1.6; }
  .step-line-num{
    flex:0 0 27px; height:27px; margin-top:1px; border-radius:50%;
    background: var(--primary); color:#fff;
    font-family:'Fraunces',serif; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .step-label{
    font-weight: 700; font-family: 'Fraunces', serif; font-size: 16px;
    color: var(--primary-dark); margin: 18px 0 8px; padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .step-label:first-child{ margin-top: 0; padding-top: 0; border-top: none; }

  .url-row{ display:flex; gap:8px; }
  .url-row input{ flex:1; }
  .url-status{ font-size: 12.5px; margin-top: 6px; color: var(--primary); }
  .url-status.error{ color: var(--accent); }
  .url-status.loading{ color: var(--ink-soft); }
  .paste-toggle{ background:none; border:none; color: var(--ink-soft); font-size: 12.5px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 6px; }
  .paste-box{ display:none; margin-top: 10px; }
  .paste-box.open{ display:block; }

  .modal-actions{ display:flex; justify-content: space-between; align-items:center; margin-top: 24px; padding-top:18px; border-top: 1px dashed var(--line); }
  .modal-actions .left, .modal-actions .right{ display:flex; gap:10px; }

  .wakelock-row{ margin-bottom: 20px; }
  #btnWakeLock.active{ background: var(--primary); color: #fff; border-color: transparent; }

  footer{ max-width: 1000px; margin: 44px auto 0; padding: 0 24px; text-align:center; }
  footer button{ background:none; border:none; color: var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; }
  .data-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom: 6px; }
  .data-actions .btn{ font-size: 13px; padding: 9px 16px; text-decoration: none; }

  .scroll-top-btn{
    position: fixed;
    right: 18px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.28);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 40;
    transition: transform .15s ease, opacity .2s ease;
  }
  .scroll-top-btn.visible{ display: flex; }
  .scroll-top-btn:active{ transform: scale(0.92); }

  /* ---------- Home ---------- */
  .home-hero{ max-width: 1000px; margin: 0 auto; padding: 34px 24px 4px; }
  .home-hero h2{ font-size: 30px; margin: 4px 0 16px; color: var(--primary-dark); }
  .home-hero .chips{ margin-bottom: 18px; }

  /* ---------- Converter ---------- */
  .conv-section{ margin-bottom: 22px; }
  .conv-section h4{ font-size: 12.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--ink-soft); margin: 0 0 10px; font-weight: 700; }
  .conv-row{ display:flex; align-items:center; gap: 9px; flex-wrap: wrap; }
  .conv-row input[type=number]{ width: 92px; flex: none; }
  .conv-row select{
    flex: 1 1 170px; font-family:'Karla',sans-serif; font-size: 14px;
    padding: 9px 11px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  }
  .conv-row strong{ font-family:'Fraunces',serif; font-size: 18px; color: var(--primary-dark); min-width: 54px; }
  .conv-note{ color: var(--ink-soft); font-size: 13px; margin: -8px 0 20px; }

  @media (max-width: 560px){
    header h1{ font-size: 32px; }
    header{ padding-top: calc(44px + env(safe-area-inset-top)); }
    .modal-inner{ padding: 18px 16px 20px; }
    .overlay{ padding: 0; align-items: flex-end; }
    .modal{ max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; width: 100%; max-width: 100%; }
    input[type=text], input[type=number], input[type=url], textarea, select, .conv-row select{ font-size: 16px; }
    .btn{ padding: 13px 20px; }
    .chip{ padding: 9px 14px; }
    .stars.lg .star{ width: 34px; height: 33px; }
    .ing-row input[type=checkbox]{ width: 21px; height: 21px; }
    .modal-actions{ flex-wrap: wrap; gap: 10px; }
    .modal-actions .left, .modal-actions .right{ width: 100%; }
    .modal-actions .right{ flex-direction: column-reverse; }
    .modal-actions button{ width: 100%; text-align: center; }
    body{ padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FBF7EC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2c0 3 1.5 4 1.5 7a3.5 3.5 0 0 1-7 0c0-3 1.5-4 1.5-7"/>
        <path d="M6 9v13"/>
        <path d="M15 2v8a3 3 0 0 0 3 3v9"/>
        <path d="M18 2v8"/>
      </svg>
    </div>
    <div>
      <h1>Kuchařka</h1>
      <p>vlastní sbírka receptů</p>
    </div>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button type="button" class="btn btn-ghost" id="btnOpenConverter">🌡️ Převodník jednotek</button>
    <button class="btn btn-primary" id="btnNew">+ Nový recept</button>
  </div>
</header>

<div class="home-hero">
  <h2>Co dnes uvaříme?</h2>
  <div class="chips" id="quickFilters"></div>
  <button class="btn btn-primary" id="btnRandom">🎲 Vyber mi recept</button>
</div>

<div class="toolbar">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Hledat podle názvu, suroviny nebo štítku…">
  </div>
  <div class="chips" id="tagFilters"></div>
  <div class="finder">
    <div class="pantry-head">🧺 Co mám doma</div>
    <div class="pantry-add-row">
      <input type="text" id="pantryAddInput" placeholder="přidat surovinu do seznamu…">
      <button type="button" class="btn btn-ghost" id="btnPantryAdd">+ Přidat</button>
    </div>
    <div class="pantry-list" id="pantryList"></div>
    <div class="finder-extra">
      <input type="text" id="haveInput" placeholder="krátkodobě navíc (nepřidá se do seznamu)…">
    </div>
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="onlyFull" style="width:auto;"> jen recepty, na které mám vše
    </label>
  </div>

  <div class="sort-row">
    <label for="sortSelect">Seřazení</label>
    <select id="sortSelect">
      <option value="newest">od nejnovějšího</option>
      <option value="oldest">od nejstaršího</option>
      <option value="rating">od nejlépe hodnocených</option>
      <option value="ingredients">podle počtu dostupných ingrediencí</option>
    </select>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">
  <svg viewBox="0 0 100 100" fill="none" style="stroke:var(--ink-soft)" stroke-width="2.2" stroke-linecap="round">
    <ellipse cx="50" cy="72" rx="34" ry="9"/>
    <path d="M18 55a32 22 0 0 0 64 0"/>
    <path d="M50 20v22M40 26l10-8 10 8"/>
  </svg>
  <h3>Zatím žádné recepty</h3>
  <p>Přidej první recept tlačítkem „+ Nový recept“.</p>
</div>

<footer>
  <div class="data-actions">
    <button type="button" class="btn btn-ghost" id="btnExport">⬇ Zálohovat recepty</button>
    <button type="button" class="btn btn-ghost" id="btnImportTrigger">⬆ Nahrát zálohu</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>
  <div class="url-status" id="importStatus" style="margin-top:10px;"></div>
  <button id="btnResetAll">smazat všechny recepty</button>
</footer>

<button type="button" id="btnScrollTop" class="scroll-top-btn" title="Nahoru" aria-label="Nahoru">↑</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-strip"></div>
    <div class="modal-inner" id="modalContent"></div>
  </div>
</div>

<div class="overlay" id="converterOverlay">
  <div class="modal">
    <div class="modal-strip"></div>
    <div class="modal-inner" id="converterContent"></div>
  </div>
</div>

<script>
const TAGS = [
  { id: 'vyzkouseno', label: 'vyzkoušeno', color: 'var(--tag-vyzkouseno)' },
  { id: 'nevyzkouseno', label: 'nevyzkoušeno', color: 'var(--tag-nevyzkouseno)' },
  { id: 'snidane', label: 'snídaně', color: 'var(--tag-snidane)' },
  { id: 'obed', label: 'hlavní jídlo', color: 'var(--tag-obed)' },
  { id: 'dezert', label: 'dezert', color: 'var(--tag-dezert)' },
  { id: 'sladke', label: 'sladké', color: 'var(--tag-sladke)' },
  { id: 'slane', label: 'slané', color: 'var(--tag-slane)' },
  { id: 'bezmasne', label: 'bezmasé', color: 'var(--tag-bezmasne)' },
  { id: 'jaro', label: 'jaro', color: 'var(--tag-jaro)' },

function normalize(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}

function tokenize(s){
  return normalize(s).split(/[^a-z0-9]+/).filter(Boolean).map(canonicalWord);
}

// a handful of common Czech kitchen words whose declension isn't just a
// suffix change (e.g. sůl→soli), so no amount of suffix-trimming catches them
const IRREGULAR_WORD_MAP = {
  'soli': 'sul',
  'sole': 'sul',
};
function canonicalWord(w){ return IRREGULAR_WORD_MAP[w] || w; }

// declension-tolerant word match: compares how much of the shorter word's
// start matches the longer one, rather than cutting both to a fixed length —
// handles endings of very different lengths (kuře/kuřeti, cibule/cibulí, …)
function wordsMatch(a, b){
  if(a === b) return true;
  const shorter = Math.min(a.length, b.length);
  if(shorter <= 3) return false; // too short to fuzzy-match safely
  let common = 0;
  while(common < shorter && a[common] === b[common]) common++;
  return common >= shorter - 2 && common >= 3;
}

function stem(word){
  if(word.length <= 3) return word;
  const cut = Math.max(4, word.length - 2);
  return word.slice(0, cut);
}

function cleanStep(s){
  s = (s||'').trim();
  if(s && !/[a-zA-ZÀ-ž]/.test(s)) return ''; // no letters at all — just a bare number/punctuation, not real step text
  return s.replace(/^\s*(krok\s*\d+[:.\)]?|step\s*\d+[:.\)]?|\d+[\.\)])\s*/i,'').trim();
}

function migrateRecipe(r, orderIndex, total){

    r.steps = src.split('\n').map(s => cleanStep(s.trim())).filter(Boolean);

  ensureChecked(r);
  if(!Array.isArray(r.tags)) r.tags = [];
  if(typeof r.rating !== 'number') r.rating = 0;
  if(typeof r.createdAt !== 'number'){
    // no timestamp yet (older save) — backfill so existing order (oldest→newest) is preserved
    r.createdAt = Date.now() - (total - orderIndex) * 1000;
  }
  return r;
}

// ---------- translation ----------
function isLikelyEnglish(text){
  const words = normalize(text).split(/\s+/).filter(Boolean);
  if(words.length < 4) return false;
  const enWords = new Set(['the','and','with','for','into','until','add','mix','heat','minutes','minute','cup','cups','tablespoon','tablespoons','teaspoon','teaspoons','oven','bake','cook','stir','preheat','salt','pepper','sugar','flour','butter','eggs','egg','water','oil','of','to','in','on','is','are','this','that','you','your','from','over','then','large','small','fresh','chopped','minced','ingredients','instructions','recipe','serve','serves','degrees','a','an','it','well']);
  let count = 0;
  words.forEach(w => { if(enWords.has(w)) count++; });
  return (count / words.length) > 0.08;
}

function chunkText(text, maxLen){
  if(!text) return [];
  if(text.length <= maxLen) return [text];
  const parts = [];
  let current = '';
  text.split('\n').forEach(line => {
    if((current + '\n' + line).length > maxLen){
      if(current) parts.push(current);
      current = line.length > maxLen ? line.slice(0, maxLen) : line;
    } else {
      current = current ? current + '\n' + line : line;
    }
  });
  if(current) parts.push(current);
  return parts;
}

async function translateChunkGoogle(chunk){
  const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=cs&dt=t&q=${encodeURIComponent(chunk)}`);
  if(!res.ok) throw new Error('google http ' + res.status);
  const data = await res.json();
  if(!Array.isArray(data) || !Array.isArray(data[0]) || data[0].length === 0) throw new Error('google bad response');
  return data[0].map(seg => seg[0]).join('');
}

async function translateChunkMyMemory(chunk){
  const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=en|cs`);
  if(!res.ok) throw new Error('mymemory http ' + res.status);
  const data = await res.json();
  const translated = data && data.responseData && data.responseData.translatedText;
  if(!translated || /MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID LANGUAGE|AMOUNT OF WORDS/i.test(translated)){
    throw new Error('mymemory limit/error: ' + translated);
  }
  return translated;
}

async function translateChunk(chunk){
  try{
    return await translateChunkGoogle(chunk);
  }catch(e1){
    try{
      return await translateChunkMyMemory(chunk);
    }catch(e2){
      throw new Error('translation failed: ' + e1.message + ' / ' + e2.message);
    }
  }
}

async function translateText(text){
  if(!text || !text.trim()) return text || '';
  const chunks = chunkText(text, 1400);
  const results = [];
  for(const chunk of chunks){
    results.push(await translateChunk(chunk));
  }
  return results.join('\n');
}

async function translateLines(list){
  const out = [];
  for(const line of list){
    out.push(await translateText(line));
  }
  return out;
}

async function translateRecipeData(data){
  const [name, steps, ingredients] = await Promise.all([
    translateText(data.name),
    translateLines(data.steps || []),
    translateLines(data.ingredients || [])
  ]);
  return { ...data, name, steps, ingredients, translated: true };
}

// ---------- import recipe from URL / pasted text ----------
function stripTags(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || d.innerText || '';
}

function parseISODuration(str){
  if(!str) return 0;
  const m = String(str).match(/P(?:\d+D)?T?(?:(\d+)H)?(?:(\d+)M)?/i);
  if(m && (m[1] || m[2])) return (parseInt(m[1]||0,10)*60) + parseInt(m[2]||0,10);
  const num = String(str).match(/(\d+)/);
  return num ? parseInt(num[1],10) : 0;
}

function flattenInstructions(node){
  let steps = [];
  (function walk(n){
    if(!n) return;
    if(Array.isArray(n)){ n.forEach(walk); return; }
    if(typeof n === 'string'){ const t = stripTags(n).trim(); if(t) steps.push(t); return; }
    if(typeof n === 'object'){
      if(n.itemListElement){ walk(n.itemListElement); return; }
      if(n.text){ steps.push(stripTags(n.text).trim()); return; }
      if(n.name){ steps.push(stripTags(n.name).trim()); return; }
    }
  })(node);
  return steps.filter(Boolean).map(cleanStep);
}

function findRecipeNode(obj){
  if(!obj || typeof obj !== 'object') return null;
  if(Array.isArray(obj)){
    for(const o of obj){ const r = findRecipeNode(o); if(r) return r; }
    return null;
  }
  const types = Array.isArray(obj['@type']) ? obj['@type'] : [obj['@type']];
  if(types.includes('Recipe')) return obj;
  if(obj['@graph']) return findRecipeNode(obj['@graph']);
  return null;
}

function extractJsonLdRecipe(html){
  let doc;
  try{ doc = new DOMParser().parseFromString(html, 'text/html'); }catch(e){ return null; }
  const scripts = doc.querySelectorAll('script[type="application/ld+json"]');
  for(const s of scripts){
    let data;
    try{ data = JSON.parse(s.textContent); }catch(e){ continue; }
    const recipe = findRecipeNode(data);
    if(recipe){
      const ingredients = Array.isArray(recipe.recipeIngredient) ? recipe.recipeIngredient
        : Array.isArray(recipe.recipeIngredients) ? recipe.recipeIngredients
        : typeof recipe.recipeIngredient === 'string' ? recipe.recipeIngredient.split('\n')
        : [];
      const steps = flattenInstructions(recipe.recipeInstructions);
      const time = parseISODuration(recipe.totalTime) || (parseISODuration(recipe.prepTime) + parseISODuration(recipe.cookTime)) || 0;
      return {
        name: stripTags(recipe.name || '').trim(),
        ingredients: ingredients.map(i => stripTags(i).trim()).filter(Boolean),
        steps,
        time,
        tagHint: normalize((recipe.recipeCategory || '') + ' ' + (recipe.keywords || '')),
        source: 'structured'
      };
    }
  }
  return null;
}

function isMarkdownHeading(line){ return /^#{1,6}\s+\S/.test(line); }

function stripBullet(s){
  return s
    .replace(/^(?:[\*\-•]\s*)+(\[[ xX]\]\s*)?/, '')
    .replace(/^(?:[✅▪️▫️🔸🔹🟢🟠🔴🟡⚪️⚫️📍➡️👉✔️☑️🔻🔺💠♦️]\s*)+/u, '')
    .trim();
}

// filters out lines that sneak into a section but aren't real recipe content:
// markdown images, table rows (nutrition tables etc.), common UI chrome text,
// and typical Instagram-caption noise (hashtag lines, "link in bio", follow prompts)
const NOISE_PHRASES = [
  'nahlasit chybu', 'zobrazit vsechny hodnoty', 'hodnoty jsou pribl',
  'mensi porce', 'vetsi porce', 'pridat do', 'ulozit recept',
  'sdilet recept', 'vytisknout', 'komentare', 'napsat komentar',
  'link in bio', 'link v bio', 'odkaz v bio', 'follow for more', 'follow me',
  'sleduj pro vic', 'sledujte', 'uloz si', 'ulozit si', 'ulozte si', 'like if', 'dvojklik',
  'tag a friend', 'oznac kamaradku', 'oznac kamarada', 'komentar napis',
];
function isNoiseLine(line){
  const t = line.trim();
  if(!t) return true;
  if(/^!\[.*\]\(.*\)$/.test(t)) return true;   // markdown image
  if(/^\|/.test(t)) return true;                // markdown table row/divider
  if(/^(#[\p{L}\d_]+[\s,]*)+$/u.test(t)) return true; // a line that's just hashtags
  const n = normalize(t);
  if(NOISE_PHRASES.some(p => n.includes(p))) return true;
  return false;
}

// some sites (portion-slider widgets) render each ingredient's amount twice,
// e.g. "500 g 500 g mascarpone" or, when digits collide, "55 vajec" (5+5)
function collapseDuplicateAmount(line){
  let m = line.match(/^(\S.*?)\s+\1\s+(.+)$/);
  if(m) return `${m[1]} ${m[2]}`;
  m = line.match(/^(\d{1,3})\1\s+(.+)$/);
  if(m) return `${m[1]} ${m[2]}`;
  return line;
}

function extractTimeMinutes(lines, fullText){
  // prefer a "45\nCELKOVÝ" / "45 min\nTOTAL" value+label pair when present
  for(let i = 0; i < lines.length - 1; i++){
    const m = lines[i].match(/^(\d+)\s*(min\w*)?\s*$/i);
    if(m){
      const nextNorm = normalize(lines[i+1]);
      if(nextNorm.includes('celkov') || nextNorm.includes('total')) return parseInt(m[1],10);
    }
  }
  let minutes = 0;
  const hMatch = fullText.match(/(\d+)\s*(hod\.?|hodin\w*|h\b|hours?)/i);
  const mMatch = fullText.match(/(\d+)\s*(min\.?|minut\w*|minutes?)/i);
  if(hMatch) minutes += parseInt(hMatch[1],10) * 60;
  if(mMatch) minutes += parseInt(mMatch[1],10);
  return minutes;
}

function heuristicParseText(text){
  const lines = text.split('\n').map(l => l.trim());
  const ingKeywords = ['ingredience','suroviny','budete potrebovat','co budete potrebovat','potrebujeme','ingredients','you will need','youll need','what you need','shopping list','zapotrebi'];
  const insKeywords = ['postup','priprava','priprava kroku','instrukce','navod','method','directions','instructions','how to make','recipe','preparation','steps'];
  const stopKeywords = ['poznamka','nutricni','vyziva','hodnoceni','komentar','souvisejici','related','tisk','sdilet','stitky','tags','ulozeni','storage'];

  // reader services (e.g. jina.ai) return markdown with real "#" headings —
  // when present, section boundaries are far more reliable than plain-text guessing
  const markdownMode = lines.some(isMarkdownHeading);

  function headingMatches(line, keywords){
    if(markdownMode){
      const m = line.match(/^#{1,6}\s+(.+)$/);
      if(!m) return false;
      const n = normalize(m[1]);
      return keywords.some(k => n === k || n.startsWith(k) || n.includes(k));
    }
    const n = normalize(line);
    return n.length < 40 && keywords.some(k => n === k || n.includes(k));
  }

  function sectionEnd(fromIdx){
    if(markdownMode){
      for(let i = fromIdx; i < lines.length; i++){
        if(isMarkdownHeading(lines[i])) return i;
      }
      return lines.length;
    }
    let end = lines.length;
    for(let i = fromIdx; i < lines.length; i++){
      const n = normalize(lines[i]);
      if(n.length < 40 && stopKeywords.some(k => n.includes(k))){ end = i; break; }
    }
    return end;
  }

  let ingIdx = -1, insIdx = -1;
  lines.forEach((line, i) => {
    if(ingIdx === -1 && headingMatches(line, ingKeywords)) ingIdx = i;
    if(insIdx === -1 && ingIdx !== -1 && i > ingIdx && headingMatches(line, insKeywords)) insIdx = i;
  });

  let ingredients = [];
  if(ingIdx !== -1){
    const end = insIdx !== -1 ? insIdx : sectionEnd(ingIdx + 1);
    ingredients = lines.slice(ingIdx + 1, end)
      .map(stripBullet)
      .filter(l => l && l.length < 140 && !isMarkdownHeading(l) && !isNoiseLine(l))
      .map(collapseDuplicateAmount)
      .map(reorderIngredientAmount);
  }

  let steps = [];
  if(insIdx !== -1){
    const end = sectionEnd(insIdx + 1);
    steps = lines.slice(insIdx + 1, end)
      .map(stripBullet)
      .filter(l => l && !isMarkdownHeading(l) && !isNoiseLine(l))
      .map(stripMarkdownFormatting)
      .map(cleanStep)
      .filter(Boolean);
  }

  const titleLine = lines.find(l => /^title:\s*/i.test(l));
  const titleCandidate = titleLine
    ? titleLine.replace(/^title:\s*/i, '').split(/\s[-|–]\s/)[0].trim()
    : (lines.find(l => l && l.length > 2 && l.length < 100 && !l.includes('>') && !isMarkdownHeading(l)) || '');

  const minutes = extractTimeMinutes(lines, text);

  return {
    name: titleCandidate,
    ingredients,
    steps,
    time: minutes,
    tagHint: '',
    source: 'heuristic'
  };
}

function fetchWithTimeout(url, options, ms){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
}

async function tryFetchSource(url, options, ms){
  const res = await fetchWithTimeout(url, options, ms);
  if(!res.ok) throw new Error('http ' + res.status);
  const text = await res.text();
  if(!text || text.length < 200) throw new Error('prázdná odpověď');
  return text;
}

async function fetchHtml(url){
  const attempts = [
    tryFetchSource(url, { mode: 'cors' }, 8000),
    tryFetchSource('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), {}, 8000),
    tryFetchSource('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), {}, 8000),
  ];
  try{
    return await Promise.any(attempts);
  }catch(aggregateError){
    const reasons = (aggregateError.errors || []).map(e => e.message).join(' / ');
    throw new Error('stažení stránky selhalo' + (reasons ? ': ' + reasons : ''));
  }
}

async function fetchViaReader(url){
  const res = await fetchWithTimeout('https://r.jina.ai/' + url, {}, 12000);
  if(!res.ok) throw new Error('reader http ' + res.status);
  const text = await res.text();
  if(!text || text.length < 100) throw new Error('reader prázdná odpověď');
  return text;
}

function withUrlTagHint(result, url){
  result.tagHint = normalize(`${result.tagHint || ''} ${url} ${result.name || ''}`);
  return result;
}

// ---------- Instagram (post/reel caption) ----------
function isInstagramUrl(url){
  return /instagram\.com\/(p|reel|reels|tv)\//i.test(url);
}

function extractMetaContent(doc, selectors){
  for(const sel of selectors){
    const el = doc.querySelector(sel);
    const content = el && el.getAttribute('content');
    if(content && content.trim()) return content.trim();
  }
  return '';
}

function cleanInstagramCaption(raw){
  if(!raw) return '';
  // og:description usually looks like: '1,234 Likes, 56 Comments - user (@handle) on Instagram: "actual caption"'
  let text = raw;
  const m = text.match(/on Instagram:\s*"?([\s\S]*)$/i);
  if(m) text = m[1];
  text = text.replace(/"\s*$/, '');
  text = text.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&#39;/g, "'");
  return text.trim();
}

async function fetchInstagramRecipe(url){
  let html;
  try{
    html = await fetchHtml(url);
  }catch(e){
    html = await fetchViaReader(url);
  }

  let caption = '';
  let title = '';
  try{
    const doc = new DOMParser().parseFromString(html, 'text/html');
    caption = cleanInstagramCaption(extractMetaContent(doc, ['meta[property="og:description"]', 'meta[name="description"]']));
    title = extractMetaContent(doc, ['meta[property="og:title"]']);
  }catch(e){ /* html may already be plain reader text rather than markup */ }

  if(!caption){
    const m = html.match(/on Instagram:\s*"?([\s\S]{0,3000})/i);
    if(m) caption = cleanInstagramCaption('on Instagram: ' + m[1]);
  }

  if(!caption) throw new Error('nepodařilo se najít popisek příspěvku (Instagram ho možná skryl)');

  const parsed = heuristicParseText(caption);
  if(parsed.ingredients.length || parsed.steps.length){
    return withUrlTagHint({ ...parsed, name: parsed.name || title, source: 'instagram' }, url);
  }
  // couldn't confidently split the caption into ingredients/steps — hand it back for manual review
  return withUrlTagHint({
    name: title || '',
    ingredients: [],
    steps: [],
    tagHint: '',
    source: 'instagram-manual',
    rawCaption: caption,
  }, url);
}

async function fetchRecipeFromUrl(rawUrl){
  let url = rawUrl.trim();
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

  if(isInstagramUrl(url)) return fetchInstagramRecipe(url);

  let html = null;
  let htmlErr = null;
  try{
    html = await fetchHtml(url);
  }catch(e){
    htmlErr = e;
  }

  if(html){
    const structured = extractJsonLdRecipe(html);
    if(structured && (structured.ingredients.length || structured.steps.length)) return withUrlTagHint(structured, url);
    const heuristic = heuristicParseText(stripTags(html));
    if(heuristic.ingredients.length || heuristic.steps.length) return withUrlTagHint(heuristic, url);
  }

  // raw HTML failed entirely, or gave nothing usable (e.g. bot-protected site) — try a reader service as last resort
  try{
    const readerText = await fetchViaReader(url);
    return withUrlTagHint(heuristicParseText(readerText), url);
  }catch(readerErr){
    throw new Error((htmlErr ? htmlErr.message : 'stránka nemá rozpoznatelný recept') + ' / ' + readerErr.message);
  }
}

const MEAT_WORDS = [
  'kure','kureci','hovezi','vepr','veprove','krocan','krocenci','kachna','husa',
  'klobasa','salam','sunka','slanina','pancetta','prosciutto',

function hasMeatIngredient(ingredients){
  const tokens = ingredients.flatMap(tokenize);
  return MEAT_WORDS.some(w => tokens.some(t => wordsMatch(w, t)));
}

const CUP_DENSITY_KEYWORDS = [
  { word: 'mouka', gramsPerCup: 120 }, { word: 'flour', gramsPerCup: 120 },
  { word: 'cukr', gramsPerCup: 200 }, { word: 'sugar', gramsPerCup: 200 },
  { word: 'maslo', gramsPerCup: 227 }, { word: 'butter', gramsPerCup: 227 },
  { word: 'olej', gramsPerCup: 218 }, { word: 'oil', gramsPerCup: 218 },
  { word: 'mleko', gramsPerCup: 240 }, { word: 'milk', gramsPerCup: 240 },
  { word: 'voda', gramsPerCup: 236 }, { word: 'water', gramsPerCup: 236 },
  { word: 'vlocky', gramsPerCup: 90 }, { word: 'oats', gramsPerCup: 90 },
  { word: 'kakao', gramsPerCup: 84 }, { word: 'cocoa', gramsPerCup: 84 },
  { word: 'med', gramsPerCup: 340 }, { word: 'honey', gramsPerCup: 340 },
];

function findCupDensity(tokens){
  for(const entry of CUP_DENSITY_KEYWORDS){
    if(tokens.some(t => wordsMatch(entry.word, t))) return entry.gramsPerCup;
  }
  return null;
}

function parseAmountStr(s){
  s = s.trim();
  const mixed = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  if(mixed) return parseInt(mixed[1],10) + parseInt(mixed[2],10) / parseInt(mixed[3],10);
  const frac = s.match(/^(\d+)\/(\d+)$/);
  if(frac) return parseInt(frac[1],10) / parseInt(frac[2],10);
  return parseFloat(s.replace(',', '.')) || 0;
}

function stripMarkdownFormatting(s){
  return (s || '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')       // [name](url) -> name
    .replace(/\*\*([^*]+)\*\*/g, '$1')              // **bold** -> bold
    .replace(/\*([^*]+)\*/g, '$1')                  // *italic* -> italic
    .replace(/([a-záčďéěíňóřšťúůýž])(\d)/gi, '$1 $2') // missing space, e.g. "brambory500" -> "brambory 500"
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}

function reorderIngredientAmount(s){
  const cleaned = stripMarkdownFormatting(s);
  const m = cleaned.match(/(\d[\d,.\/\s-]*\s*[a-záčďéěíňóřšťúůýž]{0,12})\s*$/i);
  if(!m) return cleaned;
  const amount = m[1].trim();
  const name = cleaned.slice(0, m.index).trim();
  if(!name || !amount) return cleaned;
  return `${amount} ${name}`;
}

const AMOUNT_PATTERN = '(\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?)';
const UNIT_RE = new RegExp(AMOUNT_PATTERN + '\\s*(cups?|šálk\\w*|tablespoons?|tbsp\\.?|teaspoons?|tsp\\.?|fl\\.?\\s?oz|fluid ounces?|pounds?|lbs?\\.?|ounces?|oz\\.?)\\b', 'gi');

function convertLineUnits(line){
  if(!line) return line;
  const tokens = tokenize(line);
  const density = findCupDensity(tokens);
  let result = line.replace(UNIT_RE, (m, amtStr, unitStr) => {
    const val = parseAmountStr(amtStr);
    const u = unitStr.toLowerCase();
    let ml = null, g = null;
    if(/^cup/.test(u) || /^šálk/.test(u)){ ml = val * 236.588; if(density) g = ml / 236.588 * density; }
    else if(/^tablespoon|^tbsp/.test(u)) ml = val * 14.787;
    else if(/^teaspoon|^tsp/.test(u)) ml = val * 4.929;
    else if(/^fl|^fluid/.test(u)) ml = val * 29.574;
    else if(/^pound|^lb/.test(u)) g = val * 453.592;
    else if(/^ounce|^oz/.test(u)) g = val * 28.3495;
    if(g != null) return `${m} (≈${Math.round(g)} g)`;
    if(ml != null) return `${m} (≈${Math.round(ml)} ml)`;
    return m;
  });
  result = result.replace(/(\d+)\s*°?\s*F\b/g, (m, num) => {
    const f = parseFloat(num);
    if(f < 50 || f > 550) return m;
    const c = Math.round((f - 32) * 5/9);
    return `${m} (≈${c} °C)`;
  });
  return result;
}

// ---------- ingredient matching (declension-tolerant) ----------
function isIngredientLabel(line){
  return /^\s*\./.test(line || '');
}

function ingredientMatch(recipe, haveTokenLists){
  if(haveTokenLists.length === 0) return null;
  const realIngredients = recipe.ingredients.filter(i => !isIngredientLabel(i));
  let matched = 0;
  const missing = [];
  realIngredients.forEach(ing => {
    const ingTokens = tokenize(ing);
    const found = haveTokenLists.some(hTokens =>
      hTokens.some(ht => ingTokens.some(it => wordsMatch(ht, it)))
    );
    if(found) matched++; else missing.push(ing);
  });
  return { matched, total: realIngredients.length, missing };
}

// ---------- rendering ----------
function renderTagFilters(){
  const el = document.getElementById('tagFilters');
  el.innerHTML = '';
  TAGS.forEach(t => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeTagFilters.has(t.id) ? ' active' : '');
    if(activeTagFilters.has(t.id)) chip.style.background = t.color;
    chip.innerHTML = `<span class="dot" style="background:${t.color}"></span>${t.label}`;
    chip.onclick = () => {
      if(activeTagFilters.has(t.id)) activeTagFilters.delete(t.id);
      else activeTagFilters.add(t.id);
      render();
    };
    el.appendChild(chip);
  });
}

function starsHTML(rating, size){
  const w = size === 'lg' ? 28 : 20;
  const h = size === 'lg' ? 27 : 19;
  let html = `<div class="stars ${size==='lg'?'lg':''}">`;
  for(let i=1;i<=5;i++){
    const fraction = Math.max(0, Math.min(1, rating - (i-1)));
    html += `
      <span class="star" data-index="${i}">
        <span class="bg-star"><svg viewBox="0 0 20 19" style="width:${w}px;height:${h}px;"><path d="${STAR_PATH}"/></svg></span>
        <span class="fg-wrap" style="width:${fraction*100}%">
          <svg viewBox="0 0 20 19" style="width:${w}px;height:${h}px;"><path d="${STAR_PATH}"/></svg>
        </span>
      </span>`;
  }
  html += `</div>`;
  return html;
}

function attachStarHandlers(container, getRating, onSet){
  container.querySelectorAll('.star').forEach(starEl => {
    const idx = parseInt(starEl.dataset.index, 10);
    const leftHit = document.createElement('span');
    leftHit.className = 'hit left';
    const rightHit = document.createElement('span');
    rightHit.className = 'hit right';
    starEl.appendChild(leftHit);
    starEl.appendChild(rightHit);
    leftHit.onclick = (e) => {
      e.stopPropagation();
      const val = idx - 0.5;
      onSet(getRating() === val ? idx - 1 : val);
    };
    rightHit.onclick = (e) => {
      e.stopPropagation();
      onSet(getRating() === idx ? idx - 0.5 : idx);
    };
  });
}

function buildCardElement(r, m){
  const card = document.createElement('div');
  card.className = 'card';
  const firstTag = TAGS.find(t => r.tags.includes(t.id));
  if(firstTag) card.style.setProperty('--card-color', firstTag.color);
  let matchHtml = '';
  if(m){
    const cls = m.matched === m.total ? '' : 'partial';
    matchHtml = `<div class="match ${cls}">${m.matched}/${m.total} ingrediencí ${m.matched===m.total ? 'máš vše ✓' : '· chybí: ' + m.missing.slice(0,3).join(', ') + (m.missing.length>3?'…':'')}</div>`;
  }
  card.innerHTML = `
    <div class="tags">${TAGS.filter(t => r.tags.includes(t.id)).map(t =>
      `<span class="tag-pill" style="background:${t.color}">${t.label}</span>`
    ).join('')}</div>
    <h3>${escapeHtml(r.name)}</h3>
    <div class="meta">
      <span class="time">${r.time ? '⏱ ' + formatTime(r.time) : ''}</span>
    </div>
    ${matchHtml}
    ${starsHTML(r.rating, 'sm')}
  `;
  card.querySelectorAll('.hit, .star').forEach(el => el.style.pointerEvents = 'none');
  card.onclick = () => openView(r.id);
  return card;
}

function matchesSearch(r, searchTerm){
  if(!searchTerm) return true;
  if(normalize(r.name).includes(searchTerm)) return true;
  if(r.ingredients.some(i => normalize(i).includes(searchTerm))) return true;
  const tagLabels = r.tags.map(tid => { const t = TAGS.find(t=>t.id===tid); return t ? normalize(t.label) : ''; });
  if(tagLabels.some(l => l.includes(searchTerm))) return true;
  return false;
}

function render(){
  renderTagFilters();
  renderQuickFilters();
  renderPantryList();
  const searchTerm = normalize(document.getElementById('searchInput').value);
  const haveRaw = document.getElementById('haveInput').value;
  const extraTokens = haveRaw.split(',').map(s => tokenize(s)).filter(arr => arr.length);
  const pantryTokens = pantryItems.filter(p => p.have).map(p => tokenize(p.name)).filter(arr => arr.length);
  const haveList = [...extraTokens, ...pantryTokens];
  const onlyFull = document.getElementById('onlyFull').checked;

  let list = recipes.filter(r => {
    if(!matchesSearch(r, searchTerm)) return false;
    if(activeTagFilters.size > 0){
      const has = [...activeTagFilters].every(t => r.tags.includes(t));
      if(!has) return false;
    }
    if(!matchesQuickFilters(r)) return false;
    return true;
  });

  let matches = {};
  if(haveList.length > 0){
    list = list.map(r => ({ r, m: ingredientMatch(r, haveList) }));
    if(onlyFull) list = list.filter(x => x.m.matched === x.m.total);
    list.forEach(x => matches[x.r.id] = x.m);
    list = list.map(x => x.r);
  }

  const sortMode = document.getElementById('sortSelect').value;
  if(sortMode === 'rating'){
    list.sort((a,b) => (b.rating||0) - (a.rating||0));
  } else if(sortMode === 'ingredients'){
    list.sort((a,b) => {
      const ma = matches[a.id], mb = matches[b.id];
      const ra = ma ? ma.matched / ma.total : 0;
      const rb = mb ? mb.matched / mb.total : 0;
      return rb - ra;
    });
  } else if(sortMode === 'oldest'){
    list.sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  } else {
    list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  }

  grid.innerHTML = '';
  emptyState.style.display = (recipes.length === 0) ? 'block' : 'none';

  list.forEach(r => grid.appendChild(buildCardElement(r, matches[r.id])));
}

// ---------- quick filters & random pick ----------
const QUICK_FILTERS = [
  { id: 'fast', label: '⚡ do 20 min' },
  { id: 'favorite', label: '⭐ oblíbené (4+)' },
  { id: 'untried', label: '🌱 nevyzkoušené' },
];
let quickFilterState = new Set();

function matchesQuickFilters(r){
  if(quickFilterState.has('fast') && !(r.time && r.time <= 20)) return false;
  if(quickFilterState.has('favorite') && !(r.rating >= 4)) return false;
  if(quickFilterState.has('untried') && !r.tags.includes('nevyzkouseno')) return false;
  return true;
}

function renderQuickFilters(){
  const el = document.getElementById('quickFilters');
  el.innerHTML = '';
  QUICK_FILTERS.forEach(qf => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (quickFilterState.has(qf.id) ? ' active' : '');
    if(quickFilterState.has(qf.id)) chip.style.background = 'var(--primary)';
    chip.textContent = qf.label;
    chip.onclick = () => {
      if(quickFilterState.has(qf.id)) quickFilterState.delete(qf.id);
      else quickFilterState.add(qf.id);
      render();
    };
    el.appendChild(chip);
  });
}

function pickRandomRecipe(){
  const pool = recipes.filter(matchesQuickFilters);
  const source = pool.length ? pool : recipes;
  if(!source.length){ alert('Nejdřív přidej nějaký recept.'); return; }
  const pick = source[Math.floor(Math.random() * source.length)];
  openView(pick.id);
}

// ---------- pantry (persistent "co mám doma" checklist) ----------
const PANTRY_KEY = 'kucharka_pantry_v1';
let pantryItems = [];

async function loadPantry(){
  try{
    const raw = localStorage.getItem(PANTRY_KEY);
    pantryItems = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error('Načtení spíže selhalo', e);
    pantryItems = [];
  }
}

async function savePantry(){
  try{
    localStorage.setItem(PANTRY_KEY, JSON.stringify(pantryItems));
  }catch(e){
    console.error('Uložení spíže selhalo', e);
  }
}

function renderPantryList(){
  const el = document.getElementById('pantryList');
  if(!pantryItems.length){
    el.innerHTML = '<p class="pantry-empty">Zatím prázdné — přidej suroviny, které míváš doma, ať je nemusíš pokaždé přepisovat.</p>';
    return;
  }
  el.innerHTML = pantryItems.map(item => `
    <label class="pantry-item ${item.have ? 'have' : ''}" data-id="${item.id}">
      <input type="checkbox" data-id="${item.id}" ${item.have ? 'checked' : ''}>
      <span>${escapeHtml(item.name)}</span>
      <button type="button" class="pantry-del" data-id="${item.id}" title="Smazat">✕</button>
    </label>
  `).join('');
  el.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const item = pantryItems.find(p => p.id === cb.dataset.id);
      if(item){ item.have = cb.checked; savePantry(); }
      cb.closest('.pantry-item').classList.toggle('have', cb.checked);
      render();
    });
  });
  el.querySelectorAll('.pantry-del').forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      pantryItems = pantryItems.filter(p => p.id !== btn.dataset.id);
      savePantry();
      render();
    };
  });
}

function addPantryItem(){
  const input = document.getElementById('pantryAddInput');
  const name = input.value.trim();
  if(!name) return;
  pantryItems.push({ id: uid(), name, have: true });
  input.value = '';
  savePantry();
  render();
}

function formatTime(min){
  min = parseInt(min,10);
  if(!min) return '';
  if(min < 60) return min + ' min';
  const h = Math.floor(min/60), m = min%60;
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function renderStepsHtml(steps){
  let html = '';
  let counter = 0;
  steps.forEach(s => {
    if(isIngredientLabel(s)){
      const label = s.replace(/^\s*\.\s*/, '');
      html += `<div class="step-label">${escapeHtml(label)}</div>`;
      counter = 0;
    } else {
      counter++;
      html += `<div class="step-line"><span class="step-line-num">${counter}.</span><span>${escapeHtml(s)}</span></div>`;
    }
  });
  return html;
}

function autoGrowTextarea(el){
  if(!el) return;
  el.style.overflowY = 'hidden';
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}

async function shareRecipe(r){
  const lines = [];
  lines.push(r.name);
  if(r.time) lines.push(`⏱ ${formatTime(r.time)}`);
  lines.push('');
  lines.push('Suroviny:');
  r.ingredients.forEach(i => lines.push('- ' + i));
  lines.push('');
  lines.push('Postup:');
  (r.steps || []).forEach((s, i) => lines.push(`${i+1}. ${s}`));
  if(r.url){ lines.push(''); lines.push('Zdroj: ' + r.url); }
  const text = lines.join('\n');

  if(navigator.share){
    try{
      await navigator.share({ title: r.name, text });
    }catch(e){ /* uživatel sdílení zrušil — nic neděláme */ }
    return;
  }
  try{
    await navigator.clipboard.writeText(text);
    alert('Sdílení tu prohlížeč nepodporuje, tak jsem recept aspoň zkopírovala do schránky.');
  }catch(e){
    alert('Sdílení ani kopírování do schránky se tu bohužel nepodařilo.');
  }
}

// ---------- keep-screen-awake ----------
let wakeLock = null;
let wakeLockWanted = false;

function updateWakeLockButton(){
  const btn = document.getElementById('btnWakeLock');
  if(!btn) return;
  if(wakeLockWanted && wakeLock){
    btn.textContent = '🔆 Obrazovka svítí (klepni pro vypnutí)';
    btn.classList.add('active');
  } else {
    btn.textContent = '🔆 Nezhasínat obrazovku';
    btn.classList.remove('active');
  }
}

async function requestWakeLock(){
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; updateWakeLockButton(); });
  }catch(e){
    console.error(e);
  }
  updateWakeLockButton();
}

async function toggleWakeLock(){
  if(!('wakeLock' in navigator)){
    alert('Tvůj prohlížeč bohužel funkci „nezhasínat obrazovku" nepodporuje.');
    return;
  }
  if(wakeLockWanted){
    wakeLockWanted = false;
    if(wakeLock){ await wakeLock.release(); wakeLock = null; }
    updateWakeLockButton();
  } else {
    wakeLockWanted = true;
    await requestWakeLock();
  }
}

function releaseWakeLockOnClose(){
  wakeLockWanted = false;
  if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
}

document.addEventListener('visibilitychange', () => {
  if(wakeLockWanted && document.visibilityState === 'visible' && !wakeLock){
    requestWakeLock();
  }
});

function closeModal(){
  overlay.classList.remove('open');
  editingId = null;
  releaseWakeLockOnClose();
}

function renderModal(){
  if(modalMode === 'edit'){
    renderEditForm(editingId ? recipes.find(r=>r.id===editingId) : null);
  } else {
    renderViewModal(recipes.find(r=>r.id===editingId));
  }
}

    }

      const statusTags = new Set(EXCLUSIVE_PAIRS.flat());
      const anyChecked = Array.from(modalContent.querySelectorAll('#fTags .chip.active'))

          ['obed', ['obed','veceri','hlavni chod','dinner','lunch','maincourse','main-course','entree']],
          ['dezert', ['dezert','dessert','kolac','dort','cukrovi','cookie','pie','tart']],
          ['slane', ['slan','savory','savoury']],
          ['sladke', ['sladk','sweet']],
          ['jaro', ['jarn','spring','velikonoc']],
          ['leto', ['letni','summer']],
          ['podzim', ['podzimni','autumn','fall']],
          ['zima', ['zimni','winter','vanoc','christmas']],
        ];
        guesses.forEach(([tid, keys]) => {
          if(keys.some(k => data.tagHint.includes(k))){

        const looksMeatless = data.ingredients && data.ingredients.length && !hasMeatIngredient(data.ingredients);
        if(meatlessHint || looksMeatless){
          const chip = modalContent.querySelector('#fTags .chip[data-tag="bezmasne"]');
          if(chip && !chip.classList.contains('active')) chip.click();

    const beforeSteps = stepsEl.value;
    ingEl.value = beforeIng.split('\n').map(reorderIngredientAmount).map(convertLineUnits).join('\n');
    autoGrowTextarea(ingEl);
    stepsEl.value = beforeSteps.split('\n').map(stripMarkdownFormatting).map(convertLineUnits).join('\n');

      autoGrowTextarea(stepsEl);
      statusEl.textContent = 'Přeloženo — zkontroluj prosím výsledek.';
      statusEl.className = 'url-status';
    }catch(e){
      console.error(e);
      statusEl.textContent = 'Překlad se nepodařil (' + (e && e.message ? e.message : 'neznámá chyba') + '). Zkus to prosím znovu.';
      statusEl.className = 'url-status error';
    }

  document.getElementById('btnAutoFetch').onclick = async () => {

    setUrlStatus(isInstagramUrl(urlVal) ? 'Načítám popisek příspěvku…' : 'Načítám recept ze stránky…', false, true);
    let data;
    try{
      data = await fetchRecipeFromUrl(urlVal);
    }catch(e){
      console.error(e);
      setUrlStatus('Nepodařilo se načíst automaticky (' + (e && e.message ? e.message : 'neznámá chyba') + '). Zkus vložit zkopírovaný text stránky níže.', true);
      document.getElementById('pasteBox').classList.add('open');
      return;
    }

    if(data.source === 'instagram-manual'){
      if(data.name) document.getElementById('fName').value = data.name;
      document.getElementById('fPasteText').value = data.rawCaption || '';
      document.getElementById('pasteBox').classList.add('open');
      setUrlStatus('Popisek příspěvku se načetl, ale nešlo v něm bezpečně poznat suroviny od postupu. Zkontroluj vložený text níže a klikni na „Rozpoznat z textu“ (případně si ho tam předtím pouprav).', true);
      return;
    }

    let translationFailed = false;
    const sample = (data.name || '') + ' ' + (data.steps || []).join(' ') + ' ' + (data.ingredients || []).join(' ');
    if(isLikelyEnglish(sample)){
      setUrlStatus('Překládám do češtiny…', false, true);
      try{
        data = await translateRecipeData(data);
      }catch(e){
        console.error(e);
        translationFailed = true;
      }
    }
    applyFetchedData(data);
    let msg = data.source === 'structured' ? 'Načteno' : data.source === 'instagram' ? 'Načteno z popisku příspěvku' : 'Částečně rozpoznáno';
    if(data.translated) msg += ' a přeloženo z angličtiny';
    else if(translationFailed) msg += ' — překlad do češtiny se teď nezdařil, zkus tlačítko níže znovu';
    msg += '. Zkontroluj prosím údaje.';
    setUrlStatus(msg, data.source !== 'structured' || translationFailed);
  };

  document.getElementById('btnTogglePaste').onclick = () => {
    document.getElementById('pasteBox').classList.toggle('open');
  };

  document.getElementById('btnParsePaste').onclick = async () => {
    const text = document.getElementById('fPasteText').value;
    if(!text.trim()){ setUrlStatus('Vlož nejdřív zkopírovaný text receptu.', true); return; }
    let data = heuristicParseText(text);
    let translationFailed = false;
    if(isLikelyEnglish(text)){
      setUrlStatus('Překládám do češtiny…', false, true);
      try{
        data = await translateRecipeData(data);
      }catch(e){
        console.error(e);
        translationFailed = true;
      }
    }
    applyFetchedData(data);
    let msg = 'Rozpoznáno z vloženého textu';
    if(data.translated) msg += ' a přeloženo z angličtiny';
    else if(translationFailed) msg += ' — překlad do češtiny se teď nezdařil, zkus tlačítko výše znovu';
    msg += ' — zkontroluj a doplň prosím.';
    setUrlStatus(msg, true);
  };

  modalContent.querySelectorAll('#fTags .chip').forEach(chip => {
    chip.onclick = () => {
      const tid = chip.dataset.tag;
      const t = TAGS.find(t=>t.id===tid);
      if(draft.tags.includes(tid)){
        draft.tags = draft.tags.filter(x=>x!==tid);
        chip.classList.remove('active');
        chip.style.background = '';
      } else {
        draft.tags.push(tid);
        chip.classList.add('active');
        chip.style.background = t.color;
        EXCLUSIVE_PAIRS.forEach(pair => {
          if(pair.includes(tid)){
            const other = pair.find(x => x !== tid);
            if(draft.tags.includes(other)){
              draft.tags = draft.tags.filter(x => x !== other);
              const otherChip = modalContent.querySelector(`#fTags .chip[data-tag="${other}"]`);
              if(otherChip){ otherChip.classList.remove('active'); otherChip.style.background = ''; }
            }
          }
        });
      }
    };
  });

  document.getElementById('btnCloseEdit').onclick = () => {
    if(isNew) closeModal(); else { modalMode = 'view'; renderModal(); }
  };
  const cancelBtn = document.getElementById('btnCancelEdit');
  if(cancelBtn) cancelBtn.onclick = () => {
    if(isNew) closeModal(); else { modalMode = 'view'; renderModal(); }
  };

  document.getElementById('btnSave').onclick = () => {
    const name = document.getElementById('fName').value.trim();
    if(!name){ alert('Zadej prosím název receptu.'); return; }
    draft.name = name;
    draft.time = parseInt(document.getElementById('fTime').value, 10) || 0;
    draft.ingredients = document.getElementById('fIngredients').value.split('\n').map(s=>s.trim()).filter(Boolean);
    ensureChecked(draft);
    draft.steps = document.getElementById('fSteps').value.split('\n').map(s=>s.trim()).filter(Boolean);
    draft.url = document.getElementById('fUrl').value.trim();
    draft.note = document.getElementById('fNote').value.trim();

    if(isNew){
      draft.createdAt = Date.now();
      recipes.push(draft);
    } else {
      const idx = recipes.findIndex(x=>x.id===draft.id);
      recipes[idx] = draft;
    }
    saveRecipes();
    editingId = draft.id;
    modalMode = 'view';
    renderModal();
    render();
  };
}

// ---------- backup / restore ----------
function setImportStatus(msg, isError){
  const el = document.getElementById('importStatus');
  el.textContent = msg;
  el.className = 'url-status' + (isError ? ' error' : '');
}

document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(recipes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `kucharka-zaloha-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setImportStatus(`Staženo ${recipes.length} receptů. Soubor přenes na druhé zařízení a tam ho nahraj tlačítkem „Nahrát zálohu“.`);
};

document.getElementById('btnImportTrigger').onclick = () => {
  document.getElementById('importFile').click();
};

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let imported;
    try{
      imported = JSON.parse(reader.result);
      if(!Array.isArray(imported)) throw new Error('not an array');
    }catch(err){
      setImportStatus('Tento soubor se nepodařilo přečíst jako zálohu kuchařky.', true);
      e.target.value = '';
      return;
    }
    const valid = imported.filter(x => x && typeof x === 'object' && typeof x.name === 'string' && x.name.trim());
    if(!valid.length){
      setImportStatus('V souboru nejsou žádné použitelné recepty.', true);
      e.target.value = '';
      return;
    }
    const existingIds = new Set(recipes.map(r => r.id));
    const existingNames = new Set(recipes.map(r => normalize(r.name)));
    let added = 0, skipped = 0;
    valid.forEach(item => {
      if(existingIds.has(item.id) || existingNames.has(normalize(item.name))){
        skipped++;
        return;
      }
      const clean = migrateRecipe({ ...item, id: item.id && !existingIds.has(item.id) ? item.id : uid() });
      recipes.push(clean);
      existingIds.add(clean.id);
      existingNames.add(normalize(clean.name));
      added++;
    });
    saveRecipes();
    render();
    let msg = `Přidáno ${added} receptů ze zálohy.`;
    if(skipped) msg += ` ${skipped} už tu podle názvu bylo, ty se přeskočily.`;
    setImportStatus(msg);
    e.target.value = '';
  };
  reader.onerror = () => setImportStatus('Soubor se nepodařilo načíst.', true);
  reader.readAsText(file);
});

function wireConverter(){
  const fEl = document.getElementById('convF');
  const cEl = document.getElementById('convC');
  fEl.addEventListener('input', () => {
    cEl.value = fEl.value === '' ? '' : (((parseFloat(fEl.value) - 32) * 5/9).toFixed(1));
  });
  cEl.addEventListener('input', () => {
    fEl.value = cEl.value === '' ? '' : ((parseFloat(cEl.value) * 9/5 + 32).toFixed(1));
  });

  const calcVol = () => {
    const amt = parseFloat(document.getElementById('convVolAmount').value) || 0;
    const factor = parseFloat(document.getElementById('convVolUnit').value);
    document.getElementById('convVolResult').textContent = (amt * factor).toFixed(0);
  };
  document.getElementById('convVolAmount').addEventListener('input', calcVol);
  document.getElementById('convVolUnit').addEventListener('change', calcVol);
  calcVol();

  const calcCups = () => {
    const amt = parseFloat(document.getElementById('convCupsAmount').value) || 0;
    const factor = parseFloat(document.getElementById('convIngredient').value);
    document.getElementById('convCupsResult').textContent = (amt * factor).toFixed(0);
  };
  document.getElementById('convCupsAmount').addEventListener('input', calcCups);
  document.getElementById('convIngredient').addEventListener('change', calcCups);
  calcCups();

  const calcWeight = () => {
    const amt = parseFloat(document.getElementById('convWeightAmount').value) || 0;
    const factor = parseFloat(document.getElementById('convWeightUnit').value);
    document.getElementById('convWeightResult').textContent = (amt * factor).toFixed(0);
  };
  document.getElementById('convWeightAmount').addEventListener('input', calcWeight);
  document.getElementById('convWeightUnit').addEventListener('change', calcWeight);
  calcWeight();

  document.getElementById('btnCloseConverter').onclick = () => converterOverlay.classList.remove('open');
}
